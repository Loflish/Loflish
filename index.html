<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ECE9E2" />
    <meta name="description" content="Nos Mots Mémoriaux, un musée vivant où chacun peut laisser sa trace, ses derniers mots et ses souvenirs." />
    <meta property="og:title" content="Nos Mots Mémoriaux" />
    <meta property="og:description" content="Un musée vivant où chacun peut laisser sa trace, ses derniers mots et ses souvenirs." />
    <meta property="og:type" content="website" />
    <title>Nos Mots Mémoriaux</title>
    <!-- la police de lecture arrive en même temps que le code, pas après lui -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- la peinture de la constellation est demandée d'avance, mais seulement quand l'adresse ouvre la constellation
         (les mêmes routes que estRouteExplorer, src/lib/museum.tsx) : un profil ou une page de texte ne la télécharge pas -->
    <script>
      (function () {
        var p = (location.hash || '#/').slice(1).split('?')[0] || '/';
        if (/^\/(se-perdre|trace\/|creer|ma-trace|projet|ressources|soutenir|juridique|archives\/?$|oeuvre-commune|compte|connexion|admin|atelier\/)/.test(p)) return;
        var haut = matchMedia('(max-aspect-ratio: 3/4)').matches;
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.setAttribute('fetchpriority', 'high');
        l.href = haut ? 'hd/essais/fond-feutre-9x16.webp' : 'hd/essais/fond-feutre-16x9.webp';
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
