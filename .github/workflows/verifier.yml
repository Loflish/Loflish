# À chaque envoi sur GitHub : types, lint, tests et build, comme « npm run verifier » sur le PC.
name: Vérifier

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  site:
    name: Site (types, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run typecheck
      - run: npm --prefix server run typecheck
      - run: npm run lint
      - run: npm run test:site
      - run: npm run build

  serveur:
    name: Serveur (tests sur une vraie base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm --prefix server ci
      # test/base.ts démarre sa propre base jetable : on cherche PostgreSQL là où la machine l'a installé
      # (le chemin fixe /usr/lib/postgresql/16/bin n'existe plus sur ubuntu-latest), et on l'installe s'il manque
      - name: Trouver PostgreSQL
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
          fi
          echo "PG_BIN=$(dirname "$(ls /usr/lib/postgresql/*/bin/initdb | sort -V | tail -1)")" >> "$GITHUB_ENV"
      - run: npm run serveur:test
